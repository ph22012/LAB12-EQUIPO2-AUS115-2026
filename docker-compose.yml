version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: comercio_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_password
      POSTGRES_DB: comercioexpress
    ports:
      - "5435:5432"
    volumes:
      - ./schema_comercioexpress.sql:/docker-entrypoint-initdb.d/schema_comercioexpress.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comercioexpress"]
      interval: 3s
      timeout: 5s
      retries: 5
    restart: always

  api:
    build: .
    container_name: comercio_api
    ports:
      - "4000:4000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=tu_password
      - DB_NAME=comercioexpress
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    restart: always